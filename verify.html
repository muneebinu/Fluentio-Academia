<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certificate Verification | Fluentio Academia</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
<style>
  /* Change these two colours to match your brand */
  .fv-page{--fv-brand:#2b4bd6;--fv-brand-dark:#1b2f8f;--fv-ok:#16803c;--fv-bad:#b3261e}
  .fv-page *{box-sizing:border-box}
  body.fv-page{margin:0;min-height:100vh;font-family:Inter,Arial,sans-serif;color:#1c2333;
    background:radial-gradient(1200px 500px at 50% -10%,#e4e9ff 0%,#f6f8ff 55%,#fff 100%);
    display:flex;flex-direction:column;align-items:center;padding:28px 16px}
  .fv-top{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--fv-brand-dark);
    font-family:Outfit,Arial,sans-serif;font-weight:700;font-size:22px;margin-bottom:22px}
  .fv-top img{height:38px;width:auto}
  .fv-card{width:100%;max-width:520px;background:#fff;border-radius:18px;overflow:hidden;
    box-shadow:0 20px 50px rgba(27,47,143,.12);border:1px solid #e6e9f5}
  .fv-head{padding:26px 24px 20px;text-align:center;color:#fff;
    background:linear-gradient(135deg,var(--fv-brand),var(--fv-brand-dark))}
  .fv-head h1{margin:0;font-family:Outfit,Arial,sans-serif;font-size:22px;letter-spacing:.2px}
  .fv-head p{margin:6px 0 0;font-size:13px;opacity:.85}
  .fv-body{padding:26px 24px 28px}
  .fv-status{display:flex;align-items:center;justify-content:center;gap:10px;padding:12px 14px;border-radius:12px;
    font-weight:600;font-size:15px;margin-bottom:22px}
  .fv-status.ok{background:#e8f6ed;color:var(--fv-ok)}
  .fv-status.bad{background:#fdecea;color:var(--fv-bad)}
  .fv-status svg{width:22px;height:22px;flex:none}
  .fv-name{text-align:center;font-family:Outfit,Arial,sans-serif;font-size:28px;font-weight:700;margin:0 0 4px;color:#111a3a}
  .fv-sub{text-align:center;color:#5b6479;font-size:14px;margin:0 0 22px}
  .fv-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .fv-item{background:#f6f8ff;border-radius:12px;padding:12px 14px}
  .fv-item.wide{grid-column:1/-1}
  .fv-item span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:#6a7390;margin-bottom:3px}
  .fv-item strong{font-size:15px;word-break:break-word}
  .fv-msg{text-align:center;color:#4a5368;font-size:14px;line-height:1.6;margin:0 0 6px}
  .fv-form{display:flex;gap:8px;margin-top:18px}
  .fv-form input{flex:1;min-width:0;padding:12px 14px;border:1px solid #cfd5ea;border-radius:10px;font:inherit;font-size:15px}
  .fv-form input:focus{outline:2px solid var(--fv-brand);border-color:transparent}
  .fv-form button{padding:12px 18px;border:0;border-radius:10px;background:var(--fv-brand);color:#fff;font:inherit;font-weight:600;cursor:pointer}
  .fv-form button:hover{background:var(--fv-brand-dark)}
  .fv-foot{text-align:center;font-size:12.5px;color:#6a7390;padding:16px 20px;border-top:1px solid #eef0f8;background:#fafbff;line-height:1.6}
  .fv-foot a{color:var(--fv-brand);text-decoration:none;font-weight:600}
  @media(max-width:420px){.fv-grid{grid-template-columns:1fr}.fv-name{font-size:24px}}
</style>
</head>
<body class="fv-page">

<a class="fv-top" href="index.html"><img src="assets/logo.png" alt="Fluentio Academia logo"><span>Fluentio Academia</span></a>

<main class="fv-card">
  <div class="fv-head">
    <h1>Certificate Verification</h1>
    <p>Official record check</p>
  </div>
  <div class="fv-body" id="fv-body"><p class="fv-msg">Checking certificate…</p></div>
  <div class="fv-foot">
    Issued by Fluentio Academia, online language institute.<br>
    Questions? <a href="contact.html">Contact us</a>
  </div>
</main>

<script>
(function () {
  var body = document.getElementById('fv-body');
  var CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 12.5l2.8 2.8L16 9.5"/></svg>';
  var CROSS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9 9l6 6M15 9l-6 6"/></svg>';

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }
  function status(ok, text) {
    var s = el('div', 'fv-status ' + (ok ? 'ok' : 'bad'));
    s.innerHTML = ok ? CHECK : CROSS;
    s.appendChild(el('span', '', text));
    return s;
  }
  function item(label, value, wide) {
    var d = el('div', 'fv-item' + (wide ? ' wide' : ''));
    d.appendChild(el('span', '', label));
    d.appendChild(el('strong', '', value));
    return d;
  }
  function prettyDate(s) {
    var d = new Date(s + 'T00:00:00');
    if (isNaN(d)) return s;
    return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
  }
  function searchForm() {
    var f = el('form', 'fv-form');
    var i = el('input'); i.placeholder = 'Enter certificate ID'; i.autocomplete = 'off';
    var b = el('button', '', 'Verify'); b.type = 'submit';
    f.appendChild(i); f.appendChild(b);
    f.addEventListener('submit', function (e) {
      e.preventDefault();
      var v = i.value.trim().toUpperCase();
      if (v) location.search = '?id=' + encodeURIComponent(v);
    });
    return f;
  }

  var id = (new URLSearchParams(location.search).get('id') || '').trim().toUpperCase();
  if (!id) {
    body.textContent = '';
    body.appendChild(el('p', 'fv-msg', 'Scan the QR code on a Fluentio Academia certificate, or enter the certificate ID below.'));
    body.appendChild(searchForm());
    return;
  }

  fetch('certificates.json', { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (db) {
      body.textContent = '';
      var c = Object.prototype.hasOwnProperty.call(db, id) ? db[id] : null;
      if (!c) {
        body.appendChild(status(false, 'Certificate not found'));
        body.appendChild(el('p', 'fv-msg', 'No certificate with ID "' + id + '" exists in our records. Please check the ID and try again.'));
        body.appendChild(searchForm());
        return;
      }
      body.appendChild(status(true, 'Verified: this certificate is authentic'));
      body.appendChild(el('h2', 'fv-name', c.name));
      body.appendChild(el('p', 'fv-sub', 'has successfully completed the course below'));
      var g = el('div', 'fv-grid');
      g.appendChild(item('Course', c.course));
      g.appendChild(item('Result', c.result));
      g.appendChild(item('Date of issue', prettyDate(c.issued)));
      g.appendChild(item('Certificate ID', id));
      if (c.email) g.appendChild(item('Student email', c.email, true));
      body.appendChild(g);
    })
    .catch(function () {
      body.textContent = '';
      body.appendChild(status(false, 'Could not load records'));
      body.appendChild(el('p', 'fv-msg', 'Please check your internet connection and try again.'));
    });
})();
</script>
</body>
</html>
